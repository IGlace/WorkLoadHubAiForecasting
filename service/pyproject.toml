[project]
name = "whf"
version = "0.1.0"
description = "WorkloadHub AI Forecasting service and CLI"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.6",
    "holidays>=0.60",
    "pydantic>=2.7",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "github-copilot-sdk>=1.0.11,<2",
    "chronos-forecasting>=2.3,<3",
    "torch>=2.6",
]

[project.scripts]
whf = "whf.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.6",
    "ty>=0.0.78",
    "pytest-xdist>=3.8.0",
]
build = [
    "pyinstaller>=6.22,<7",
    "pyinstaller-hooks-contrib>=2026.7",
]

# torch resolves to the CUDA build by default (1.2 GB plus NVIDIA runtime libraries); the service
# only ever forecasts on CPU, so it is pinned to PyTorch's CPU wheel index instead.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whf"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends/Query defaults are idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running accuracy gates", "copilot: needs a signed-in Copilot CLI (WHF_COPILOT_LIVE=1)"]
pythonpath = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore::DeprecationWarning:fastapi.*"]
