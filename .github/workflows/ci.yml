# The same gate as scripts/check.ps1 and scripts/check.sh: the Java module and the parity gate's test.
# Keep the three in step when any of them changes.
#
# This workflow does not run: the owner deleted the `origin` remote on 2026-09-12, so there is no GitHub
# to fire it. It is kept, and kept in step, so it works again if a remote ever returns. Until then the gate
# is `bash scripts/check.sh` run by hand in the development container (CLAUDE.md, "Toolchain").
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: Java module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        run: mvn -B verify
        working-directory: server

  tools:
    name: Parity gate test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --python 3.11 --with pytest pytest server/tools/tests -q
      - name: Release script self-test
        run: bash scripts/test-release.sh
