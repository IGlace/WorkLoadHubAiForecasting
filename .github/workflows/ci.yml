# The same gate as scripts/check.ps1 and scripts/check.sh: the Java module's `mvn verify`, then the
# showcase front end's `npm run check` in server/forecast-web/ui. Keep the three in step when any of them
# changes.
#
# Paused on 2026-09-14 at the owner's request: the weekly hours forecast design is about to rewrite
# `model/`, `planned/` and `backtest/`, so a run per push would only report a gate the work has not
# reached yet. Only `workflow_dispatch` is left, so the workflow can still be started by hand from the
# Actions tab. Until it is restored the gate is `bash scripts/check.sh` run by hand in the development
# container (CLAUDE.md, "Toolchain").
#
# To restore, put these two triggers back above `workflow_dispatch`:
#   push:
#     branches: [main, dev]
#   pull_request:
name: CI

on:
  workflow_dispatch:

jobs:
  server:
    name: Java module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        run: mvn -B verify
        working-directory: server
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/forecast-web/ui/package-lock.json
      - name: UI check
        run: npm ci --no-audit --no-fund && npm run check
        working-directory: server/forecast-web/ui
