# The same gate as scripts/check.ps1 and scripts/check.sh: the Java module and the parity gate's test.
# Keep the three in step when any of them changes.
#
# Paused on 2026-09-14 at the owner's request: the weekly hours forecast design is about to rewrite
# `model/`, `planned/` and `backtest/`, so a run per push would only report a gate the work has not
# reached yet. Only `workflow_dispatch` is left, so the workflow can still be started by hand from the
# Actions tab. Until it is restored the gate is `bash scripts/check.sh` run by hand in the development
# container (CLAUDE.md, "Toolchain").
#
# To restore, put these two triggers back above `workflow_dispatch`:
#   push:
#     branches: [main, dev]
#   pull_request:
name: CI

on:
  workflow_dispatch:

jobs:
  server:
    name: Java module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        run: mvn -B verify
        working-directory: server

  tools:
    name: Parity gate test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --python 3.11 --with pytest pytest server/tools/tests -q
      - name: Release script self-test
        run: bash scripts/test-release.sh
