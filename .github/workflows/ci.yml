# The same gate as scripts/check.ps1 (fast checks, the slow pytest subset, the app build, the
# Linux freeze and the Windows installer). Keep the two in step when either changes.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  service:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: service } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv python install 3.11
      - run: uv sync
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q -m "not slow" -n 6
      - run: uv run pytest -q -m slow -n 6

  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  freeze-linux:
    runs-on: ubuntu-latest
    needs: [service]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv python install 3.11
      # Neither download runs on CI: the CLI is a Windows-only concern for the installer and the
      # Chronos-2 weights are about 480 MB per run. The Linux freeze therefore also exercises the
      # without-weights branch of the smoke test - chronos2 must report itself unavailable.
      - run: bash scripts/build-service.sh
        env: { WHF_SKIP_CLI_DOWNLOAD: "1", WHF_SKIP_MODEL_DOWNLOAD: "1" }

  package-windows:
    runs-on: windows-latest
    needs: [service, app]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv python install 3.11
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: pwsh scripts/build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: WorkloadHub-Forecast-Setup
          path: dist/installer/*.exe
          if-no-files-found: error
