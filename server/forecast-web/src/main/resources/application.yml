# The showcase host. The whf.* block is what the production server sets (server/README.md, "Properties");
# the forecast-web.* block is demo wiring (design 2026-09-18, section 3.4).
server:
  port: 8080

spring:
  datasource:
    url: ${FORECAST_WEB_DB_URL:jdbc:postgresql://localhost:5432/workloadhub}
    username: ${FORECAST_WEB_DB_USER:workloadhub}
    password: ${FORECAST_WEB_DB_PASSWORD:workloadhub}
    hikari:
      data-source-properties:
        # The schema the WorkloadHub tables and the module's own are in. PostgreSQL resolves an unqualified
        # name against the search path, which for the workloadhub role is "$user", public -- neither of them
        # -- so without this every query fails with `relation "users" does not exist` however right the URL
        # is. Flyway hides it: the module names its schema itself (ForecastMigrations), so the migrations
        # pass and the first request is what breaks. It sits here rather than in the URL so that pointing
        # FORECAST_WEB_DB_URL at another database does not silently drop it.
        currentSchema: ${FORECAST_WEB_DB_SCHEMA:task_service,public}

whf:
  token-key: ${WHF_TOKEN_KEY:}          # blank: forecast-web.token-key-file supplies one
  work-dir: ${WHF_WORK_DIR:${user.home}/.workloadhub-forecast}
  run-threads: 2
  forecast:
    windows: 2
  flyway:
    enabled: true
  web:
    enabled: false                       # this host has its own controllers: the module's trust requestedBy as given

forecast-web:
  clock:
    today: ${FORECAST_WEB_TODAY:}   # blank: follow the system date. The seed ends on the day it was generated.
    adjustable: true
  token-key-file: ${user.home}/.workloadhub-forecast/forecast-web/token.key
  ui-dir: ${FORECAST_WEB_UI:ui/dist}

logging:
  level:
    root: INFO
    com.workloadhub.forecast: INFO
