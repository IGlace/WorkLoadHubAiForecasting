spring:
  main:
    web-application-type: none
    banner-mode: off
logging:
  level:
    root: warn
    com.workloadhub.forecast: info
whf:
  flyway:
    enabled: false   # no auto-configured start-up migration: init-db runs the migrations explicitly, after
                     # creating the WorkloadHub tables, and eval runs them itself through Services.open
