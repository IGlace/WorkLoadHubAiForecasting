<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 505" width="700" height="505" role="img"
     aria-label="State machine for a run: the numeric status only ever reaches done, while the AI status moves from not_requested to ok, unverified or failed.">
  <style>
    text { font-family: "Segoe UI", Calibri, system-ui, sans-serif; fill: #16202c; }
    .r  { font-size: 11.5px; font-weight: 700; fill: #1d4d84; letter-spacing: .4px; }
    .s  { font-size: 12px; font-weight: 700; }
    .d  { font-size: 10px; fill: #4b5c6e; }
    .e  { font-size: 9.5px; fill: #5b6b7d; }
    .eb { font-size: 9.5px; font-weight: 700; fill: #5b6b7d; }
    .mono { font-family: Consolas, "Courier New", monospace; font-size: 11px; font-weight: 700; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7d"/>
    </marker>
  </defs>

  <!-- region A -->
  <rect x="8" y="8" width="684" height="190" rx="9" fill="#f6faff" stroke="#2f6fb5" stroke-width="1.4"/>
  <text class="r" x="22" y="28">RUN STATUS — DID THE MATHS FINISH?  (COLUMN “STATUS” IN THE RUNS LIST)</text>

  <circle cx="44" cy="80" r="8" fill="#16202c"/>
  <line x1="52" y1="80" x2="66" y2="80" stroke="#5b6b7d" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="70" y="56" width="160" height="48" rx="9" fill="#ffffff" stroke="#9db4cc" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text class="s" x="150" y="76" text-anchor="middle">computing</text>
  <text class="e" x="150" y="92" text-anchor="middle">in memory only — nothing on disk</text>

  <line x1="230" y1="80" x2="242" y2="80" stroke="#5b6b7d" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M300,54 L360,80 L300,106 L240,80 Z" fill="#ffffff" stroke="#5b6b7d" stroke-width="1.5"/>
  <text class="d" x="300" y="84" text-anchor="middle">all ten stages ok?</text>

  <line x1="360" y1="80" x2="392" y2="80" stroke="#5b6b7d" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="eb" x="366" y="74">yes</text>
  <rect x="396" y="56" width="180" height="48" rx="9" fill="#eaf6ef" stroke="#2e7d5b" stroke-width="2.2"/>
  <text class="mono" x="486" y="78" text-anchor="middle">done</text>
  <text class="e" x="486" y="93" text-anchor="middle">the only value you can ever see</text>

  <path d="M300,106 L300,148 L392,148" fill="none" stroke="#b3403a" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="eb" x="306" y="122" fill="#b3403a">no</text>
  <rect x="396" y="124" width="284" height="48" rx="9" fill="#fdf0ef" stroke="#b3403a" stroke-width="1.5"/>
  <text class="s" x="408" y="144" fill="#8c2f2a">no row at all</text>
  <text class="e" x="408" y="160">everything is rolled back, so a failed forecast leaves no trace</text>

  <text class="e" x="22" y="128">There is no “running”</text>
  <text class="e" x="22" y="142">and no “failed” run.</text>
  <text class="e" x="22" y="156">The row is written</text>
  <text class="e" x="22" y="170">only at the very end.</text>

  <!-- region B -->
  <rect x="8" y="210" width="684" height="280" rx="9" fill="#faf7fe" stroke="#6b4fa8" stroke-width="1.4"/>
  <text class="r" x="22" y="230" fill="#4a3576">AI STATUS — DID COPILOT WRITE THE WORDS?  (COLUMN “AI” IN THE RUNS LIST)</text>

  <circle cx="34" cy="300" r="8" fill="#16202c"/>
  <line x1="42" y1="300" x2="62" y2="300" stroke="#5b6b7d" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="66" y="277" width="148" height="46" rx="9" fill="#ffffff" stroke="#9db4cc" stroke-width="1.6"/>
  <text class="mono" x="140" y="297" text-anchor="middle">not_requested</text>
  <text class="e" x="140" y="313" text-anchor="middle">every new run starts here</text>

  <line x1="214" y1="300" x2="246" y2="300" stroke="#5b6b7d" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="e" x="230" y="268" text-anchor="middle">you ask</text>
  <text class="e" x="230" y="280" text-anchor="middle">for words</text>

  <rect x="250" y="277" width="150" height="46" rx="9" fill="#ffffff" stroke="#6b4fa8" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text class="s" x="325" y="297" text-anchor="middle">asking Copilot</text>
  <text class="e" x="325" y="313" text-anchor="middle">never stored on the run</text>

  <path d="M400,300 L432,300" fill="none" stroke="#5b6b7d" stroke-width="1.6"/>
  <path d="M432,300 L432,268 L462,268" fill="none" stroke="#5b6b7d" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M432,300 L432,318 L462,318" fill="none" stroke="#5b6b7d" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M432,300 L432,372 L462,372" fill="none" stroke="#5b6b7d" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="466" y="248" width="210" height="40" rx="9" fill="#eaf6ef" stroke="#2e7d5b" stroke-width="1.8"/>
  <text class="mono" x="478" y="266">ok</text>
  <text class="e" x="500" y="266">every figure was matched</text>
  <text class="e" x="478" y="281">the narrative is shown with no banner</text>

  <rect x="466" y="294" width="210" height="50" rx="9" fill="#fdf6e9" stroke="#b7791f" stroke-width="1.8"/>
  <text class="mono" x="478" y="312">unverified</text>
  <text class="e" x="478" y="327">at least one figure could not be matched</text>
  <text class="e" x="478" y="339">the text is still saved and still shown</text>

  <rect x="466" y="348" width="210" height="48" rx="9" fill="#fdf0ef" stroke="#b3403a" stroke-width="1.8"/>
  <text class="mono" x="478" y="365">failed:&lt;reason&gt;</text>
  <text class="e" x="478" y="379">not_signed_in · cli_unavailable · timeout ·</text>
  <text class="e" x="478" y="390">invalid_output · model_error · other</text>

  <path d="M571,396 L571,430 L325,430 L325,327" fill="none" stroke="#6b4fa8" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text class="e" x="345" y="412" fill="#4a3576">you can ask again from any of the three —</text>
  <text class="e" x="345" y="423" fill="#4a3576">the new answer replaces the old one</text>

  <text class="e" x="22" y="450">The forecast numbers are already saved and are never touched by any of this. Only the words and this one column change.</text>
  <text class="e" x="22" y="466">Re-asking overwrites the stored audit record of the previous answer.</text>
</svg>
