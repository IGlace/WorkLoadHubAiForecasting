<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 412" width="700" height="412" role="img"
     aria-label="The AI summary document has exactly six sections, and each section is displayed on a particular screen of the app.">
  <style>
    text { font-family: "Segoe UI", Calibri, system-ui, sans-serif; fill: #16202c; }
    .hd  { font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: .3px; }
    .hd2 { font-size: 10.5px; font-weight: 700; fill: #1d4d84; letter-spacing: .3px; }
    .mono{ font-family: Consolas, "Courier New", monospace; font-size: 11px; font-weight: 700; fill: #1d4d84; }
    .n   { font-size: 10px; }
    .nb  { font-size: 10px; font-weight: 700; }
    .e   { font-size: 9.5px; fill: #5b6b7d; }
    .pil { font-size: 9px; font-weight: 700; fill: #ffffff; }
    .cd  { font-size: 11px; font-weight: 700; }
  </style>

  <!-- document -->
  <rect x="14" y="30" width="420" height="322" rx="8" fill="#ffffff" stroke="#2f6fb5" stroke-width="1.8"/>
  <path d="M14,38 a8,8 0 0 1 8,-8 h404 a8,8 0 0 1 8,8 v22 h-420 z" fill="#2f6fb5"/>
  <text class="hd" x="26" y="52">THE AI SUMMARY — ONE JSON DOCUMENT, EXACTLY SIX SECTIONS</text>

  <line x1="14" y1="102" x2="434" y2="102" stroke="#c7d7e8" stroke-width="1"/>
  <line x1="14" y1="168" x2="434" y2="168" stroke="#c7d7e8" stroke-width="1"/>
  <line x1="14" y1="214" x2="434" y2="214" stroke="#c7d7e8" stroke-width="1"/>
  <line x1="14" y1="264" x2="434" y2="264" stroke="#c7d7e8" stroke-width="1"/>
  <line x1="14" y1="310" x2="434" y2="310" stroke="#c7d7e8" stroke-width="1"/>

  <text class="mono" x="26" y="76">run_summary</text>
  <text class="n" x="26" y="93">One paragraph tying the whole two weeks together. Up to 2 000 characters.</text>
  <rect x="404" y="66" width="18" height="14" rx="4" fill="#2f6fb5"/><text class="pil" x="413" y="76" text-anchor="middle">T</text>

  <text class="mono" x="26" y="120">members[ ]  — one entry per person</text>
  <text class="n" x="26" y="136">A risk level (low / medium / high), a short written summary of up to 1 200</text>
  <text class="n" x="26" y="149">characters, a list of warnings, and the patterns the model believes it sees —</text>
  <text class="n" x="26" y="162">each pattern given as a statement plus the evidence behind it.</text>
  <rect x="404" y="110" width="18" height="14" rx="4" fill="#2e7d5b"/><text class="pil" x="413" y="120" text-anchor="middle">M</text>

  <text class="mono" x="26" y="188">team_risks[ ]</text>
  <text class="n" x="26" y="205">A short title (≤120 characters), a detail paragraph (≤800) and the people it concerns.</text>
  <rect x="404" y="178" width="18" height="14" rx="4" fill="#2f6fb5"/><text class="pil" x="413" y="188" text-anchor="middle">T</text>

  <text class="mono" x="26" y="234">rebalancing[ ]</text>
  <text class="n" x="26" y="250">Suggested moves: from whom, to whom, how many hours, in which week, and why.</text>
  <text class="n" x="26" y="261">Nothing is ever applied automatically.</text>
  <rect x="404" y="224" width="18" height="14" rx="4" fill="#6b4fa8"/><text class="pil" x="413" y="234" text-anchor="middle">R</text>

  <text class="mono" x="26" y="284">suggested_adjustments[ ]</text>
  <text class="n" x="26" y="301">Suggested capacity changes: which person, how many hours more or less, and why.</text>
  <rect x="404" y="274" width="18" height="14" rx="4" fill="#6b4fa8"/><text class="pil" x="413" y="284" text-anchor="middle">R</text>

  <text class="mono" x="26" y="330">model_notes</text>
  <text class="n" x="26" y="346">Plain-language caveats about the forecast itself. Up to 1 000 characters.</text>
  <rect x="404" y="320" width="18" height="14" rx="4" fill="#2f6fb5"/><text class="pil" x="413" y="330" text-anchor="middle">T</text>

  <!-- where it appears -->
  <text class="hd2" x="452" y="44">WHERE EACH PART APPEARS</text>

  <rect x="452" y="54" width="234" height="69" rx="7" fill="#eaf1f9" stroke="#2f6fb5" stroke-width="1.6"/>
  <rect x="462" y="64" width="18" height="14" rx="4" fill="#2f6fb5"/><text class="pil" x="471" y="74" text-anchor="middle">T</text>
  <text class="cd" x="488" y="76">Team result screen</text>
  <text class="e" x="462" y="93">The “AI summary” panel: the opening</text>
  <text class="e" x="462" y="105">paragraph, every warning gathered into</text>
  <text class="e" x="462" y="117">one list, the team risks and the model notes.</text>

  <rect x="452" y="133" width="234" height="69" rx="7" fill="#eaf6ef" stroke="#2e7d5b" stroke-width="1.6"/>
  <rect x="462" y="143" width="18" height="14" rx="4" fill="#2e7d5b"/><text class="pil" x="471" y="153" text-anchor="middle">M</text>
  <text class="cd" x="488" y="155">Member detail screen</text>
  <text class="e" x="462" y="172">That one person’s risk badge, written</text>
  <text class="e" x="462" y="184">summary, warnings and observed patterns,</text>
  <text class="e" x="462" y="196">next to their own history chart.</text>

  <rect x="452" y="212" width="234" height="69" rx="7" fill="#f2edfa" stroke="#6b4fa8" stroke-width="1.6"/>
  <rect x="462" y="222" width="18" height="14" rx="4" fill="#6b4fa8"/><text class="pil" x="471" y="232" text-anchor="middle">R</text>
  <text class="cd" x="488" y="234">Rebalancing page</text>
  <text class="e" x="462" y="251">The suggested moves and the suggested</text>
  <text class="e" x="462" y="263">capacity changes, under a heading that</text>
  <text class="e" x="462" y="275">says plainly “not applied”.</text>

  <rect x="452" y="291" width="234" height="69" rx="7" fill="#fdf6e9" stroke="#b7791f" stroke-width="1.5"/>
  <text class="hd2" x="462" y="309" fill="#8a5c12">WORTH KNOWING</text>
  <text class="e" x="462" y="326">No single screen shows all six sections. The</text>
  <text class="e" x="462" y="338">Team result panel is roughly a third of it; the</text>
  <text class="e" x="462" y="350">rest is on the other two screens.</text>

  <text class="e" x="14" y="372">The template is strict: a reply with a missing section, an unexpected field or an over-long paragraph is rejected outright and asked for again.</text>
  <text class="e" x="14" y="386">Every section is optional in content but fixed in shape — the app will never receive a seventh section, and never a section it does not know how to display.</text>
  <text class="e" x="14" y="400">The one thing the model is allowed to originate is the size of a suggested move or capacity change; every other figure must already exist in the forecast.</text>
</svg>
