<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 776" width="700" height="776" role="img"
     aria-label="UML sequence diagram of one forecast run, from the click to the AI summary appearing on screen.">
  <style>
    text { font-family: "Segoe UI", Calibri, system-ui, sans-serif; fill: #16202c; }
    .hd { font-size: 11px; font-weight: 700; }
    .hs { font-size: 9px; fill: #5b6b7d; }
    .m  { font-size: 10px; fill: #22303f; }
    .mb { font-size: 10px; font-weight: 700; fill: #22303f; }
    .fr { font-size: 9.5px; font-weight: 700; fill: #1d4d84; letter-spacing: .3px; }
    .n  { font-size: 9.5px; fill: #5b6b7d; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#33465a"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9" fill="none" stroke="#5b6b7d" stroke-width="1.4"/>
    </marker>
  </defs>

  <!-- lifelines -->
  <g stroke="#a9bccf" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="48"  y1="74" x2="48"  y2="746"/>
    <line x1="152" y1="74" x2="152" y2="746"/>
    <line x1="268" y1="74" x2="268" y2="746"/>
    <line x1="400" y1="74" x2="400" y2="746"/>
    <line x1="524" y1="74" x2="524" y2="746"/>
    <line x1="644" y1="74" x2="644" y2="746"/>
  </g>

  <!-- heads -->
  <rect x="8"   y="36" width="80"  height="38" rx="6" fill="#f6ecd6" stroke="#c8a45c" stroke-width="1.5"/>
  <text class="hd" x="48"  y="54" text-anchor="middle">You</text>
  <text class="hs" x="48"  y="67" text-anchor="middle">team leader</text>
  <rect x="104" y="36" width="96"  height="38" rx="6" fill="#fdf6e9" stroke="#c8a45c" stroke-width="1.5"/>
  <text class="hd" x="152" y="54" text-anchor="middle">Window</text>
  <text class="hs" x="152" y="67" text-anchor="middle">React screens</text>
  <rect x="216" y="36" width="104" height="38" rx="6" fill="#fdf6e9" stroke="#c8a45c" stroke-width="1.5"/>
  <text class="hd" x="268" y="54" text-anchor="middle">Bridge + Main</text>
  <text class="hs" x="268" y="67" text-anchor="middle">holds the token</text>
  <rect x="344" y="36" width="112" height="38" rx="6" fill="#eaf1f9" stroke="#2f6fb5" stroke-width="1.5"/>
  <text class="hd" x="400" y="54" text-anchor="middle">Forecast service</text>
  <text class="hs" x="400" y="67" text-anchor="middle">Python · all the maths</text>
  <rect x="478" y="36" width="92"  height="38" rx="6" fill="#eaf6ef" stroke="#2e7d5b" stroke-width="1.5"/>
  <text class="hd" x="524" y="54" text-anchor="middle">SQLite</text>
  <text class="hs" x="524" y="67" text-anchor="middle">workload.db</text>
  <rect x="596" y="36" width="96"  height="38" rx="6" fill="#f2edfa" stroke="#6b4fa8" stroke-width="1.5"/>
  <text class="hd" x="644" y="54" text-anchor="middle">Copilot</text>
  <text class="hs" x="644" y="67" text-anchor="middle">your seat</text>

  <!-- part 1 : the numbers -->
  <text class="m" x="54" y="96">click “Run forecast”</text>
  <line x1="48" y1="100" x2="148" y2="100" stroke="#33465a" stroke-width="1.4" marker-end="url(#a)"/>

  <text class="m" x="158" y="120">api:request  { POST /runs, team, as-of }</text>
  <line x1="152" y1="124" x2="264" y2="124" stroke="#33465a" stroke-width="1.4" marker-end="url(#a)"/>

  <text class="m" x="274" y="146">POST /runs  +  X-WHF-Token</text>
  <line x1="268" y1="150" x2="396" y2="150" stroke="#33465a" stroke-width="1.4" marker-end="url(#a)"/>

  <text class="m" x="406" y="172">read all tables</text>
  <line x1="400" y1="176" x2="520" y2="176" stroke="#33465a" stroke-width="1.4" marker-end="url(#a)"/>
  <text class="n" x="406" y="192">history, people, calendar</text>
  <line x1="524" y1="196" x2="404" y2="196" stroke="#5b6b7d" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#ao)"/>

  <rect x="306" y="208" width="188" height="52" rx="6" fill="#eef4fb" stroke="#2f6fb5" stroke-width="1.6"/>
  <text class="mb" x="400" y="225" text-anchor="middle">the ten deterministic stages</text>
  <text class="n"  x="400" y="239" text-anchor="middle">features → backtest → champion →</text>
  <text class="n"  x="400" y="252" text-anchor="middle">predict → place → capacity → overload</text>

  <text class="m" x="406" y="276">INSERT run + forecasts + facts — one transaction</text>
  <line x1="400" y1="280" x2="520" y2="280" stroke="#33465a" stroke-width="1.4" marker-end="url(#a)"/>
  <text class="n" x="406" y="296">run id</text>
  <line x1="524" y1="300" x2="404" y2="300" stroke="#5b6b7d" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#ao)"/>

  <text class="m" x="274" y="318">200 OK — run id, both weeks, champion, score, every forecast row</text>
  <line x1="400" y1="322" x2="272" y2="322" stroke="#5b6b7d" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#ao)"/>
  <text class="m" x="158" y="340">the finished numbers</text>
  <line x1="268" y1="344" x2="156" y2="344" stroke="#5b6b7d" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#ao)"/>

  <text class="m" x="54" y="362">totals on screen · Windows notification if anyone is over capacity</text>
  <line x1="152" y1="366" x2="52" y2="366" stroke="#33465a" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- opt fragment -->
  <rect x="20" y="382" width="664" height="356" rx="5" fill="none" stroke="#6b4fa8" stroke-width="1.4"/>
  <path d="M20,382 L196,382 L196,398 L184,410 L20,410 Z" fill="#ede6f8" stroke="#6b4fa8" stroke-width="1.4"/>
  <text class="fr" x="28" y="396">opt</text>
  <text class="fr" x="52" y="396" fill="#4a3576">[ AI narrative asked for ]</text>

  <text class="m" x="158" y="426">POST /runs/{id}/narrative</text>
  <line x1="152" y1="430" x2="396" y2="430" stroke="#33465a" stroke-width="1.4" marker-end="url(#a)"/>

  <text class="m" x="406" y="450">read back the saved facts</text>
  <line x1="400" y1="454" x2="520" y2="454" stroke="#33465a" stroke-width="1.4" marker-end="url(#a)"/>

  <text class="m" x="406" y="474">rule sheet + facts + 8 read-only tools + 5 skills</text>
  <line x1="400" y1="478" x2="640" y2="478" stroke="#33465a" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="352" y="490" width="332" height="66" rx="5" fill="none" stroke="#9db4cc" stroke-width="1.2"/>
  <path d="M352,490 L444,490 L444,502 L434,512 L352,512 Z" fill="#eef2f6" stroke="#9db4cc" stroke-width="1.2"/>
  <text class="fr" x="359" y="503">loop</text>
  <text class="fr" x="385" y="503" fill="#5b6b7d">[ per fact needed ]</text>

  <text class="m" x="406" y="526">tool call — “give me this member’s weeks”</text>
  <line x1="644" y1="530" x2="404" y2="530" stroke="#33465a" stroke-width="1.4" marker-end="url(#a)"/>
  <text class="m" x="406" y="546">the exact stored numbers, nothing else</text>
  <line x1="400" y1="550" x2="640" y2="550" stroke="#5b6b7d" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#ao)"/>

  <text class="m" x="406" y="574">one JSON document — words only</text>
  <line x1="644" y1="578" x2="404" y2="578" stroke="#5b6b7d" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#ao)"/>

  <rect x="285" y="590" width="230" height="46" rx="6" fill="#eef4fb" stroke="#2f6fb5" stroke-width="1.6"/>
  <text class="mb" x="400" y="607" text-anchor="middle">check shape, then check</text>
  <text class="mb" x="400" y="620" text-anchor="middle">every number against the facts</text>
  <text class="n"  x="400" y="632" text-anchor="middle">mismatch → the run is marked “unverified”</text>

  <rect x="96" y="592" width="176" height="44" rx="6" fill="#ffffff" stroke="#9db4cc" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text class="n" x="106" y="608">meanwhile the window asks</text>
  <text class="n" x="106" y="620">GET …/narrative/progress</text>
  <text class="n" x="106" y="632">once a second for the step</text>

  <text class="m" x="406" y="654">save the narrative envelope, set ai_status</text>
  <line x1="400" y1="658" x2="520" y2="658" stroke="#33465a" stroke-width="1.4" marker-end="url(#a)"/>

  <text class="m" x="158" y="678">ok  |  unverified  |  failed:&lt;reason&gt;   — plus the written text</text>
  <line x1="400" y1="682" x2="156" y2="682" stroke="#5b6b7d" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#ao)"/>

  <text class="m" x="54" y="702">AI Summary panel and Rebalancing page fill in</text>
  <line x1="152" y1="706" x2="52" y2="706" stroke="#33465a" stroke-width="1.4" marker-end="url(#a)"/>

  <text class="n" x="30" y="726">Both HTTP calls are synchronous: the window waits. The forecast is already safe on disk before Copilot is ever contacted.</text>
</svg>
