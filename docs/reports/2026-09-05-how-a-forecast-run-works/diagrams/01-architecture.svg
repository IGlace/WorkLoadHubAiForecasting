<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 566" width="700" height="566" role="img"
     aria-label="Architecture: the desktop app talks to a local Python service, which owns the database and is the only component that contacts GitHub Copilot.">
  <style>
    text { font-family: "Segoe UI", Calibri, system-ui, sans-serif; fill: #16202c; }
    .h    { font-size: 13.5px; font-weight: 700; }
    .g    { font-size: 11.5px; font-weight: 700; fill: #1d4d84; letter-spacing: .4px; }
    .s    { font-size: 11px; fill: #4b5c6e; }
    .e    { font-size: 10.5px; fill: #5b6b7d; }
    .star { font-size: 10.5px; font-weight: 700; fill: #1d4d84; }
    .starv{ font-size: 10.5px; font-weight: 700; fill: #6b4fa8; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7d"/>
    </marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b4fa8"/>
    </marker>
  </defs>

  <!-- the machine -->
  <rect x="6" y="6" width="688" height="470" rx="12" fill="#f6f9fc" stroke="#9db4cc" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text class="g" x="24" y="28">YOUR WINDOWS PC — EVERYTHING INSIDE THIS BOX STAYS ON THIS MACHINE</text>

  <!-- desktop app -->
  <rect x="22" y="40" width="656" height="118" rx="9" fill="#ffffff" stroke="#c7d7e8" stroke-width="1.4"/>
  <text class="g" x="34" y="58">WORKLOADHUB DESKTOP APP (ELECTRON)</text>

  <rect x="34" y="66" width="196" height="80" rx="7" fill="#fdf6e9" stroke="#d8b673" stroke-width="1.6"/>
  <text class="h" x="46" y="86">Window (React)</text>
  <text class="s" x="46" y="103">the screens you click:</text>
  <text class="s" x="46" y="118">Run · Runs · Team result ·</text>
  <text class="s" x="46" y="133">Member · Rebalancing</text>

  <rect x="246" y="66" width="196" height="80" rx="7" fill="#fdf6e9" stroke="#d8b673" stroke-width="1.6"/>
  <text class="h" x="258" y="86">Preload bridge</text>
  <text class="s" x="258" y="103">the one guarded door</text>
  <text class="s" x="258" y="118">out of the window;</text>
  <text class="s" x="258" y="133">channel “api:request”</text>

  <rect x="458" y="66" width="208" height="80" rx="7" fill="#fdf6e9" stroke="#d8b673" stroke-width="1.6"/>
  <text class="h" x="470" y="86">Main process</text>
  <text class="s" x="470" y="103">starts the service, holds</text>
  <text class="s" x="470" y="118">the port and the secret</text>
  <text class="s" x="470" y="133">token, sends the HTTP call</text>

  <line x1="230" y1="106" x2="244" y2="106" stroke="#5b6b7d" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="442" y1="106" x2="456" y2="106" stroke="#5b6b7d" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- app -> service -->
  <line x1="562" y1="158" x2="562" y2="186" stroke="#5b6b7d" stroke-width="1.8" marker-end="url(#a)"/>
  <text class="e" x="552" y="170" text-anchor="end">HTTP to 127.0.0.1 : &lt;port&gt;</text>
  <text class="e" x="552" y="183" text-anchor="end">header X-WHF-Token — no token, no answer</text>

  <!-- service -->
  <rect x="22" y="190" width="656" height="136" rx="9" fill="#ffffff" stroke="#c7d7e8" stroke-width="1.4"/>
  <text class="g" x="34" y="208">FORECAST SERVICE (PYTHON, FASTAPI) — LOOPBACK ONLY</text>

  <rect x="34" y="216" width="196" height="96" rx="7" fill="#eaf1f9" stroke="#2f6fb5" stroke-width="1.6"/>
  <text class="h" x="46" y="236">HTTP API</text>
  <text class="s" x="46" y="253">POST /runs</text>
  <text class="s" x="46" y="268">POST /runs/{id}/narrative</text>
  <text class="s" x="46" y="283">GET /runs/{id}</text>
  <text class="s" x="46" y="298">GET …/narrative/progress</text>

  <rect x="246" y="216" width="196" height="96" rx="7" fill="#eaf1f9" stroke="#2f6fb5" stroke-width="1.6"/>
  <text class="h" x="258" y="236">Forecast pipeline</text>
  <text class="s" x="258" y="253">features → backtest →</text>
  <text class="s" x="258" y="268">champion → placement →</text>
  <text class="s" x="258" y="283">capacity → overload</text>
  <text class="star" x="258" y="301">★ every number is born here</text>

  <rect x="458" y="216" width="208" height="96" rx="7" fill="#f2edfa" stroke="#6b4fa8" stroke-width="1.6"/>
  <text class="h" x="470" y="236">Copilot session</text>
  <text class="s" x="470" y="253">hands the saved facts to</text>
  <text class="s" x="470" y="268">Copilot through read-only</text>
  <text class="s" x="470" y="283">tools, gets sentences back</text>
  <text class="starv" x="470" y="301">★ creates no forecast number</text>

  <line x1="230" y1="264" x2="244" y2="264" stroke="#5b6b7d" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="442" y1="264" x2="456" y2="264" stroke="#5b6b7d" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- database -->
  <line x1="344" y1="326" x2="344" y2="368" stroke="#5b6b7d" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="e" x="352" y="352">reads history · writes the run</text>

  <rect x="194" y="372" width="300" height="66" rx="7" fill="#eaf6ef" stroke="#2e7d5b" stroke-width="1.6"/>
  <text class="h" x="206" y="392">SQLite database file — workload.db</text>
  <text class="s" x="206" y="409">members · teams · tasks · holidays · vacations</text>
  <text class="s" x="206" y="425">runs · forecasts · run_facts · run_narratives</text>

  <text class="e" x="30" y="392">A single file in your</text>
  <text class="e" x="30" y="406">Windows user folder.</text>
  <text class="e" x="30" y="420">No server, no upload,</text>
  <text class="e" x="30" y="434">no other computer.</text>

  <!-- copilot -->
  <line x1="562" y1="326" x2="562" y2="494" stroke="#6b4fa8" stroke-width="1.8" marker-end="url(#av)"/>
  <text class="e" x="572" y="400" fill="#6b4fa8">the only traffic that</text>
  <text class="e" x="572" y="414" fill="#6b4fa8">ever leaves this PC —</text>
  <text class="e" x="572" y="428" fill="#6b4fa8">and only when you</text>
  <text class="e" x="572" y="442" fill="#6b4fa8">tick “AI narrative”</text>

  <rect x="437" y="498" width="250" height="56" rx="9" fill="#f2edfa" stroke="#6b4fa8" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text class="h" x="449" y="519" fill="#4a3576">GitHub Copilot</text>
  <text class="s" x="449" y="537">your own Copilot Enterprise seat, signed in</text>
  <text class="s" x="449" y="550">through the Copilot CLI — no other AI provider</text>
</svg>
